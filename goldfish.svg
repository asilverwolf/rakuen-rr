<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310">
  <defs>
    <!-- Body gradient: bright orange-red -->
    <radialGradient id="body" cx="54%" cy="38%" r="52%">
      <stop offset="0%"   stop-color="#ffaa77"/>
      <stop offset="28%"  stop-color="#ee4418"/>
      <stop offset="72%"  stop-color="#cc1a06"/>
      <stop offset="100%" stop-color="#8c0e03"/>
    </radialGradient>
    <!-- Belly highlight: white-cream -->
    <radialGradient id="belly" cx="50%" cy="74%" r="44%">
      <stop offset="0%"   stop-color="#fff5ee" stop-opacity="0.78"/>
      <stop offset="70%"  stop-color="#ffcc99" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff8844" stop-opacity="0"/>
    </radialGradient>
    <!-- Sheen highlight on top -->
    <radialGradient id="sheen" cx="44%" cy="22%" r="30%">
      <stop offset="0%"   stop-color="#ffddcc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffaa77" stop-opacity="0"/>
    </radialGradient>
    <!-- Tail: fades to almost nothing -->
    <linearGradient id="tailA" x1="1" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse" x1="210" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#dd3a10" stop-opacity="0.40"/>
      <stop offset="50%"  stop-color="#ff8855" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffe8dd" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="tailB" x1="1" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse" x1="210" y1="0" x2="0" y2="0">
      <stop offset="0%"   stop-color="#cc2e08" stop-opacity="0.30"/>
      <stop offset="60%"  stop-color="#ff9966" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffeeee" stop-opacity="0.02"/>
    </linearGradient>
    <!-- Dorsal fin -->
    <linearGradient id="dorsalG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff9966" stop-opacity="0.08"/>
      <stop offset="55%"  stop-color="#ee5522" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#dd2200" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Soft blur for tail -->
    <filter id="blur1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- ══ TAIL RIBBONS (behind body) ══ -->
  <g filter="url(#blur1)">
    <!-- Upper fan — wide soft ribbons -->
    <path d="M 208,148 C 148,138 88,102 28,52"
          stroke="url(#tailA)" stroke-width="28" fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M 208,148 C 140,132 72,80 15,22"
          stroke="url(#tailA)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.48"/>
    <!-- Lower fan -->
    <path d="M 208,162 C 148,172 88,208 26,260"
          stroke="url(#tailA)" stroke-width="28" fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M 208,162 C 140,175 70,220 14,285"
          stroke="url(#tailA)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.48"/>
    <!-- Mid ribbons -->
    <path d="M 208,155 C 145,152 80,148 15,142"
          stroke="url(#tailA)" stroke-width="8"  fill="none" stroke-linecap="round" opacity="0.35"/>
    <path d="M 208,155 C 140,148 72,125 10,108"
          stroke="url(#tailA)" stroke-width="5"  fill="none" stroke-linecap="round" opacity="0.25"/>
    <path d="M 208,155 C 140,162 72,182 8,200"
          stroke="url(#tailA)" stroke-width="5"  fill="none" stroke-linecap="round" opacity="0.25"/>
  </g>
  <!-- Thinner accent ribbons -->
  <g filter="url(#blur2)" opacity="0.55">
    <path d="M 210,150 C 148,145 82,130 18,118"
          stroke="url(#tailB)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 210,152 C 148,158 82,170 18,182"
          stroke="url(#tailB)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 210,148 C 142,138 74,105 22,68"
          stroke="url(#tailB)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 210,158 C 142,168 74,196 22,232"
          stroke="url(#tailB)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ══ BODY ══ -->
  <!-- Main oval (ryukin - round and plump) -->
  <ellipse cx="330" cy="155" rx="125" ry="100" fill="url(#body)"/>
  <!-- Belly highlight -->
  <ellipse cx="330" cy="182" rx="86" ry="58" fill="url(#belly)"/>
  <!-- Top sheen -->
  <ellipse cx="308" cy="120" rx="72" ry="42" fill="url(#sheen)"/>

  <!-- ══ DORSAL FIN ══ -->
  <path d="M 302,58 C 320,18 365,12 392,55 L 390,60 C 362,68 328,66 302,62 Z"
        fill="url(#dorsalG)" opacity="0.85"/>
  <!-- Fin rays -->
  <line x1="310" y1="61" x2="307" y2="36" stroke="#ff9966" stroke-width="1" stroke-opacity="0.32"/>
  <line x1="328" y1="58" x2="326" y2="24" stroke="#ff9966" stroke-width="1" stroke-opacity="0.32"/>
  <line x1="348" y1="56" x2="348" y2="18" stroke="#ff9966" stroke-width="1" stroke-opacity="0.32"/>
  <line x1="368" y1="57" x2="370" y2="28" stroke="#ff9966" stroke-width="1" stroke-opacity="0.32"/>
  <line x1="384" y1="60" x2="387" y2="40" stroke="#ff9966" stroke-width="1" stroke-opacity="0.32"/>

  <!-- ══ PECTORAL FIN ══ -->
  <ellipse cx="372" cy="192" rx="46" ry="17"
           fill="rgba(255,148,72,0.20)" transform="rotate(28,372,192)"/>

  <!-- ══ SCALE TEXTURE (very subtle arcs) ══ -->
  <g opacity="0.065" stroke="#aa1204" stroke-width="1.1" fill="none">
    <path d="M 278,115 Q 264,102 278,91"/>
    <path d="M 305,107 Q 290,92 306,80"/>
    <path d="M 332,103 Q 317,87 334,75"/>
    <path d="M 358,106 Q 344,90 360,77"/>
    <path d="M 382,114 Q 368,99 384,86"/>
    <path d="M 278,158 Q 263,144 278,133"/>
    <path d="M 305,168 Q 290,152 306,140"/>
    <path d="M 332,172 Q 317,155 334,143"/>
    <path d="M 358,168 Q 344,152 360,140"/>
    <path d="M 382,158 Q 368,142 384,130"/>
  </g>

  <!-- ══ EYE ══ -->
  <circle cx="435" cy="132" r="14"   fill="rgba(14,4,1,0.92)"/>
  <circle cx="439" cy="127" r="5.8"  fill="rgba(255,255,255,0.80)"/>
  <circle cx="440" cy="126" r="2.2"  fill="white"/>
  <!-- Iris colour -->
  <circle cx="435" cy="132" r="9"    fill="rgba(88,22,4,0.55)"/>
  <circle cx="439" cy="127" r="5.8"  fill="rgba(255,255,255,0.80)"/>

  <!-- ══ MOUTH ══ -->
  <path d="M 452,148 Q 460,153 452,158"
        stroke="rgba(175,44,18,0.52)" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
