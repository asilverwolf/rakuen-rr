<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<meta property="og:title" content="蔡佩伶｜小提琴學位音樂會">
<title>蔡佩伶｜小提琴學位音樂會</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;
  background:#111;
  overflow:hidden;
  font-family:Georgia,'Times New Roman',serif;
  color:#ccc;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}

/* ── Header ─────────────────────────────── */
#hdr{
  position:fixed;top:0;left:0;right:0;
  height:40px;
  background:rgba(10,10,10,.96);
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
  z-index:200;
  gap:12px;
}
.ht{
  font-size:9.5px;letter-spacing:.28em;
  text-transform:uppercase;
  color:rgba(200,200,200,.35);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ── Stage ───────────────────────────────── */
#stage{
  position:fixed;
  top:40px;left:0;right:0;bottom:0;
  display:flex;align-items:center;justify-content:center;
  background:#111;
}

/* ══════════════════════════════════════════
   BOOK MODE  (landscape / wide)
══════════════════════════════════════════ */
#book-mode{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
}

/* Book container
   IMPORTANT: no `filter` — filter creates a flat compositing layer
   and breaks CSS 3D transforms on child elements.
   Use box-shadow instead. Explicit w/h so aspect-ratio resolves in flex. */
#bk{
  position:relative;
  /* Pick tighter constraint between width & height limits */
  width: min(calc(100vw - 40px), calc((100vh - 64px) * 1800 / 1272));
  height: min(calc(100vh - 64px), calc((100vw - 40px) * 1272 / 1800));
  /* 3D context for leaf flip */
  transform-style:preserve-3d;
  perspective:3000px;
  /* Shadow — box-shadow does NOT break 3D transforms */
  box-shadow:0 20px 70px rgba(0,0,0,.92), 0 4px 16px rgba(0,0,0,.6);
}

/* Left & right static background halves */
.bg{
  position:absolute;top:0;height:100%;width:50%;
  overflow:hidden;
  background:#1a1a1a; /* dark placeholder */
}
#lbg{left:0;}
#rbg{left:50%;}
.bg img{width:100%;height:100%;object-fit:cover;display:block;}

/* Spine shadow overlay */
#spine{
  position:absolute;top:0;bottom:0;
  left:calc(50% - 6px);width:12px;
  background:linear-gradient(to right,
    rgba(0,0,0,.45) 0%,rgba(0,0,0,.1) 40%,
    rgba(0,0,0,.1) 60%,rgba(0,0,0,.4) 100%);
  pointer-events:none;z-index:20;
}

/* ── The turning leaf ─────────────────────
   Sits over the RIGHT half, transform-origin = left spine
   Forward flip: rotateY(0) → rotateY(-180deg)
   Backward flip: repositioned to LEFT, origin=right, then rotates back
──────────────────────────────────────────── */
#leaf{
  position:absolute;top:0;height:100%;
  left:50%;width:50%;
  transform-origin:left center;
  transform-style:preserve-3d;
  transform:rotateY(0deg);
  z-index:10;
}
#leaf.animate{
  transition:transform .68s cubic-bezier(.455,.03,.515,.955);
}
/* front face (default: shows current right page) */
#lf,#lb{
  position:absolute;inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  overflow:hidden;
}
#lf img,#lb img{width:100%;height:100%;object-fit:cover;display:block;}
/* back face placed behind and mirrored so it reads correctly after flip */
#lb{transform:rotateY(180deg);}

/* Page-turn shadow on front face */
#lf::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to left,rgba(0,0,0,0) 55%,rgba(0,0,0,.28) 100%);
  opacity:0;transition:opacity .68s;
}
#leaf.animate #lf::after{opacity:1;}

/* Shadow on exposed left page as right page lifts */
#lbg::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(to left,rgba(0,0,0,.25) 0%,transparent 60%);
  opacity:0;transition:opacity .68s;
}
#lbg.shadowed::after{opacity:1;}

/* ── Click zones ────────────────────────── */
#zl,#zr{
  position:absolute;top:0;bottom:0;width:38%;
  cursor:pointer;z-index:30;
}
#zl{left:0;}
#zr{right:0;}

/* ── Hover nav arrows ───────────────────── */
.arr{
  position:fixed;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border-radius:50%;
  background:rgba(12,12,12,.7);
  border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.45);
  font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s,background .2s,color .2s;
  z-index:100;
}
#stage:hover .arr{opacity:1;}
.arr:hover{background:rgba(30,30,30,.9);color:#fff;}
.arr:disabled,.arr.off{opacity:0!important;pointer-events:none;}
#al{left:10px;}
#ar{right:10px;}

/* ══════════════════════════════════════════
   SINGLE/PORTRAIT MODE
══════════════════════════════════════════ */
#single-mode{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
}
#si{
  max-width:100%;max-height:100%;
  object-fit:contain;display:block;
  box-shadow:0 10px 50px rgba(0,0,0,.9);
}

/* Slide transitions */
@keyframes sIn {from{opacity:0;transform:translateX(var(--tx,50px))}to{opacity:1;transform:none}}
.slide-anim{animation:sIn .28s ease forwards;}

/* Tap zones for portrait */
#tl,#tr{
  position:fixed;top:40px;bottom:0;width:28%;
  z-index:50;cursor:pointer;
}
#tl{left:0;}
#tr{right:0;}

/* ── Page counter ─────────────────────── */
#ctr{
  position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
  font-size:9px;letter-spacing:.3em;
  color:rgba(200,200,200,.22);
  z-index:150;white-space:nowrap;
  padding-bottom:env(safe-area-inset-bottom,0px);
}

/* ── Loader ──────────────────────────── */
#ldr{
  position:fixed;inset:0;background:#111;
  display:flex;align-items:center;justify-content:center;
  z-index:999;transition:opacity .5s;
}
#ldr.done{opacity:0;pointer-events:none;}
#ldr span{
  font-size:9px;letter-spacing:.5em;text-transform:uppercase;
  color:rgba(255,255,255,.2);
  animation:pu 1.2s ease infinite;
}
@keyframes pu{0%,100%{opacity:.2}50%{opacity:.6}}

/* Cover / back-cover: mask the empty half so single page appears centered */
#mask{
  position:absolute;top:0;height:100%;width:50%;
  background:#04040A;display:none;z-index:25;pointer-events:none;
}
</style>
</head>
<body>

<div id="ldr"><span>Loading</span></div>

<!-- Header -->
<div id="hdr">
  <span class="ht">蔡佩伶｜小提琴學位音樂會</span>
  <span class="ht" id="pgn"></span>
</div>

<!-- Stage -->
<div id="stage">

  <!-- ── Book mode ── -->
  <div id="book-mode">
    <div id="bk">
      <!-- static background halves -->
      <div class="bg" id="lbg"><img id="li" src="" alt=""></div>
      <div class="bg" id="rbg"><img id="ri" src="" alt=""></div>
      <!-- turning leaf -->
      <div id="leaf">
        <div id="lf"><img id="lfi" src="" alt=""></div>
        <div id="lb"><img id="lbi" src="" alt=""></div>
      </div>
      <!-- spine -->
      <div id="spine"></div>
      <!-- cover/back mask: hides empty half so single page appears centered -->
      <div id="mask"></div>
      <!-- click zones -->
      <div id="zl" onclick="bkNav(-1)"></div>
      <div id="zr" onclick="bkNav(1)"></div>
    </div>
    <button class="arr off" id="al" onclick="bkNav(-1)">&#9664;</button>
    <button class="arr"     id="ar" onclick="bkNav(1)">&#9654;</button>
  </div>

  <!-- ── Single/portrait mode ── -->
  <div id="single-mode">
    <img id="si" src="" alt="">
    <div id="tl" onclick="snNav(-1)"></div>
    <div id="tr" onclick="snNav(1)"></div>
  </div>

</div>

<!-- Counter -->
<div id="ctr"></div>

<script>
/* ══════════════════════════════════════════
   DATA
══════════════════════════════════════════ */
// 12 single pages; A5-00=cover, A5-11=back cover
const IMGS = [
  'imgs/A5-00.jpg','imgs/A5-01.jpg','imgs/A5-02.jpg','imgs/A5-03.jpg',
  'imgs/A5-04.jpg','imgs/A5-05.jpg','imgs/A5-06.jpg','imgs/A5-07.jpg',
  'imgs/A5-08.jpg','imgs/A5-09.jpg','imgs/A5-10.jpg','imgs/A5-11.jpg',
];

// Landscape spreads
// type: 'cover'=single right, 'pair'=left+right, 'back'=single left
const SPREADS = [
  {type:'cover', R:0},             // spread 0: cover alone on right
  {type:'pair',  L:1, R:2},        // spread 1
  {type:'pair',  L:3, R:4},        // spread 2
  {type:'pair',  L:5, R:6},        // spread 3
  {type:'pair',  L:7, R:8},        // spread 4
  {type:'pair',  L:9, R:10},       // spread 5
  {type:'back',  L:11},            // spread 6: back cover alone on left
];

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let sIdx = 0;   // spread index (book mode)
let pIdx = 0;   // page index (portrait mode)
let busy = false;

/* ══════════════════════════════════════════
   DOM refs
══════════════════════════════════════════ */
const bookMode   = document.getElementById('book-mode');
const singleMode = document.getElementById('single-mode');
const leaf = document.getElementById('leaf');
const lfi  = document.getElementById('lfi');  // leaf front image
const lbi  = document.getElementById('lbi');  // leaf back image
const li   = document.getElementById('li');   // left-bg image
const ri   = document.getElementById('ri');   // right-bg image
const siEl = document.getElementById('si');   // single mode image
const lbg  = document.getElementById('lbg');  // left bg div (for shadow class)
const al   = document.getElementById('al');   // arrow left
const ar   = document.getElementById('ar');   // arrow right
const mask  = document.getElementById('mask');
const spine = document.getElementById('spine');

/* ══════════════════════════════════════════
   MODE DETECTION
══════════════════════════════════════════ */
function isBookMode() {
  return window.innerWidth >= 700 && window.innerWidth > window.innerHeight;
}

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function img(idx) { return idx != null && idx >= 0 ? IMGS[idx] : ''; }

// Show mask over one half (cover/back spreads → single page appears centered)
function showMask(side) {
  mask.style.left = side === 'left' ? '0' : '50%';
  mask.style.display = '';
  spine.style.display = 'none';
}
function hideMask() {
  mask.style.display = 'none';
  spine.style.display = '';
}
function applyMaskForSpread(idx) {
  const t = SPREADS[idx].type;
  if (t === 'cover')     showMask('left');
  else if (t === 'back') showMask('right');
  else                   hideMask();
}

// Silence leaf transform instantly (no CSS transition)
function leafInstant() {
  leaf.classList.remove('animate');
  void leaf.offsetWidth; // reflow
}

// Setup leaf on RIGHT side (normal position, no transition)
function leafToRight(frontSrc, backSrc) {
  leafInstant();
  leaf.style.left = '50%';
  leaf.style.width = '50%';
  leaf.style.transformOrigin = 'left center';
  leaf.style.transform = 'rotateY(0deg)';
  lfi.src = frontSrc;
  lbi.src = backSrc;
}

// Setup leaf on LEFT side (for backward flip)
function leafToLeft(frontSrc, backSrc) {
  leafInstant();
  leaf.style.left = '0%';
  leaf.style.width = '50%';
  leaf.style.transformOrigin = 'right center';
  leaf.style.transform = 'rotateY(0deg)';
  lfi.src = frontSrc;
  lbi.src = backSrc;
}

/* ══════════════════════════════════════════
   BOOK RENDER (instant, no animation)
══════════════════════════════════════════ */
function renderSpread(idx) {
  const s = SPREADS[idx];
  // left-bg
  li.src = (s.type === 'pair' || s.type === 'back') ? img(s.L) : '';
  // right-bg (pre-loads next right, hidden under leaf for pair/cover)
  const nxt = SPREADS[idx + 1];
  ri.src = nxt ? (nxt.R != null ? img(nxt.R) : '') : '';
  // leaf sits over right, front=current right page
  const curRight = (s.type === 'cover' || s.type === 'pair') ? img(s.R) : '';
  const nxtLeft  = nxt ? (nxt.L != null ? img(nxt.L) : '') : '';
  leafToRight(curRight, nxtLeft);
  applyMaskForSpread(idx);
}

/* ══════════════════════════════════════════
   FORWARD FLIP
══════════════════════════════════════════ */
function flipForward() {
  hideMask();
  const s   = SPREADS[sIdx];
  const nxt = SPREADS[sIdx + 1];
  if (!nxt) return;

  // Pre-load right-bg with next right page (revealed once leaf flips away)
  ri.src = nxt.R != null ? img(nxt.R) : '';
  // leaf-front = current right page, leaf-back = next left page
  lfi.src = (s.type === 'cover' || s.type === 'pair') ? img(s.R) : '';
  lbi.src = nxt.L != null ? img(nxt.L) : '';

  leafInstant();
  leaf.style.left = '50%';
  leaf.style.transformOrigin = 'left center';
  leaf.style.transform = 'rotateY(0deg)';

  lbg.classList.add('shadowed');

  // Trigger
  requestAnimationFrame(() => {
    leaf.classList.add('animate');
    leaf.style.transform = 'rotateY(-180deg)';
  });

  setTimeout(() => {
    sIdx++;
    lbg.classList.remove('shadowed');
    // Settle: left-bg = new left, leaf reset to right
    li.src = nxt.L != null ? img(nxt.L) : '';
    const nxt2 = SPREADS[sIdx + 1];
    const newRight = SPREADS[sIdx].R != null ? img(SPREADS[sIdx].R) : '';
    const nxt2Left = nxt2 ? (nxt2.L != null ? img(nxt2.L) : '') : '';
    ri.src = nxt2 ? (nxt2.R != null ? img(nxt2.R) : '') : '';
    leafToRight(newRight, nxt2Left);
    applyMaskForSpread(sIdx);
    updateUI();
    busy = false;
  }, 700);
}

/* ══════════════════════════════════════════
   BACKWARD FLIP
══════════════════════════════════════════ */
function flipBackward() {
  hideMask();
  const s   = SPREADS[sIdx];
  const prv = SPREADS[sIdx - 1];
  if (!prv) return;

  // Setup: left-bg already shows current left (s.L or empty)
  // leaf goes to LEFT side, front = current left, back = previous right
  const curLeft = (s.type === 'pair' || s.type === 'back') ? img(s.L) : '';
  const prvRight = (prv.type === 'cover' || prv.type === 'pair') ? img(prv.R) : '';
  leafToLeft(curLeft, prvRight);

  // Also set right-bg to current right (stays visible)
  ri.src = s.R != null ? img(s.R) : '';

  lbg.classList.add('shadowed');

  requestAnimationFrame(() => {
    leaf.classList.add('animate');
    // Flip rightward: leaf goes from left-half to right-half
    leaf.style.transform = 'rotateY(180deg)';
  });

  setTimeout(() => {
    sIdx--;
    lbg.classList.remove('shadowed');
    // Settle: left-bg = prev left
    li.src = prv.L != null ? img(prv.L) : '';
    const nxt2 = SPREADS[sIdx + 1];
    const newRight = (prv.type === 'cover' || prv.type === 'pair') ? img(prv.R) : '';
    const nxt2Left = nxt2 ? (nxt2.L != null ? img(nxt2.L) : '') : '';
    ri.src = nxt2 ? (nxt2.R != null ? img(nxt2.R) : '') : '';
    leafToRight(newRight, nxt2Left);
    applyMaskForSpread(sIdx);
    updateUI();
    busy = false;
  }, 700);
}

/* ══════════════════════════════════════════
   BOOK NAVIGATION
══════════════════════════════════════════ */
function bkNav(dir) {
  if (busy) return;
  if (dir > 0 && sIdx >= SPREADS.length - 1) return;
  if (dir < 0 && sIdx <= 0) return;
  busy = true;
  if (dir > 0) flipForward();
  else         flipBackward();
}

/* ══════════════════════════════════════════
   PORTRAIT (SINGLE) NAVIGATION
══════════════════════════════════════════ */
function snNav(dir) {
  const n = pIdx + dir;
  if (n < 0 || n >= IMGS.length) return;
  pIdx = n;
  siEl.style.setProperty('--tx', dir > 0 ? '50px' : '-50px');
  siEl.classList.remove('slide-anim');
  void siEl.offsetWidth;
  siEl.src = IMGS[pIdx];
  siEl.classList.add('slide-anim');
  updateUI();
}

/* ══════════════════════════════════════════
   UPDATE UI (counters, arrows)
══════════════════════════════════════════ */
function updateUI() {
  const book = isBookMode();
  if (book) {
    const total = SPREADS.length;
    document.getElementById('pgn').textContent = (sIdx + 1) + ' / ' + total;
    document.getElementById('ctr').textContent = (sIdx + 1) + ' — ' + total;
    al.classList.toggle('off', sIdx === 0);
    ar.classList.toggle('off', sIdx === SPREADS.length - 1);
  } else {
    document.getElementById('pgn').textContent = (pIdx + 1) + ' / ' + IMGS.length;
    document.getElementById('ctr').textContent = (pIdx + 1) + ' — ' + IMGS.length;
  }
}

/* ══════════════════════════════════════════
   MODE SWITCH
══════════════════════════════════════════ */
function applyMode() {
  const book = isBookMode();
  bookMode.style.display   = book ? '' : 'none';
  singleMode.style.display = book ? 'none' : '';
  document.getElementById('tl').style.display = book ? 'none' : '';
  document.getElementById('tr').style.display = book ? 'none' : '';

  if (book) {
    // Sync page index → nearest spread
    sIdx = Math.min(Math.floor(pIdx / 2), SPREADS.length - 1);
    renderSpread(sIdx);
  } else {
    // Sync spread → page
    const s = SPREADS[sIdx];
    if (s.type === 'cover')      pIdx = 0;
    else if (s.type === 'back')  pIdx = IMGS.length - 1;
    else                         pIdx = s.L;
    siEl.src = IMGS[pIdx];
  }
  updateUI();
}

/* ══════════════════════════════════════════
   KEYBOARD
══════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown','PageDown'].includes(e.key)) {
    isBookMode() ? bkNav(1) : snNav(1);
  }
  if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)) {
    isBookMode() ? bkNav(-1) : snNav(-1);
  }
  if (e.key === 'Home') { sIdx=0; pIdx=0; isBookMode()?renderSpread(0):null; siEl.src=IMGS[0]; updateUI(); }
  if (e.key === 'End')  { isBookMode()?bkNav(999):(pIdx=IMGS.length-1,siEl.src=IMGS[pIdx],updateUI()); }
});

/* ══════════════════════════════════════════
   TOUCH SWIPE
══════════════════════════════════════════ */
let tx0=null, ty0=null;
document.addEventListener('touchstart', e=>{
  tx0=e.changedTouches[0].clientX;
  ty0=e.changedTouches[0].clientY;
},{passive:true});
document.addEventListener('touchend', e=>{
  if(tx0===null) return;
  const dx=e.changedTouches[0].clientX-tx0;
  const dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>40){
    isBookMode() ? bkNav(dx<0?1:-1) : snNav(dx<0?1:-1);
  }
  tx0=ty0=null;
},{passive:true});

/* ══════════════════════════════════════════
   RESIZE
══════════════════════════════════════════ */
let resizeTimer;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(applyMode, 150);
});

/* ══════════════════════════════════════════
   INIT — preload cover then start
══════════════════════════════════════════ */
(function init() {
  const cover = new Image();
  cover.onload = cover.onerror = () => {
    applyMode();
    setTimeout(()=>document.getElementById('ldr').classList.add('done'), 100);
  };
  cover.src = IMGS[0];
})();
</script>
</body>
</html>
