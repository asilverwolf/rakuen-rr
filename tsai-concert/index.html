<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<meta property="og:title" content="蔡佩伶｜小提琴學位音樂會 節目冊">
<meta property="og:description" content="Pei-Ling Tsai — Violin Degree Recital Program Book">
<title>蔡佩伶｜小提琴學位音樂會</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #0d0d0d;
    overflow: hidden;
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #ccc;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: pan-y;
  }

  /* ── Layout ── */
  #viewer {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #header {
    flex-shrink: 0;
    width: 100%;
    padding: 12px 20px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0d0d0d;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  #header-title {
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(204,204,204,0.4);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #counter {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: rgba(204,204,204,0.35);
    flex-shrink: 0;
    margin-left: 16px;
  }

  #book-wrap {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ── Page display ── */
  #stage {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
    gap: 0;
  }

  .page-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    transition: opacity 0.25s ease;
  }

  .page-slot img {
    display: block;
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
    box-shadow: 0 12px 60px rgba(0,0,0,0.85), 0 2px 8px rgba(0,0,0,0.5);
    background: #fff;
  }

  /* Spread pages fill full width */
  .page-slot.is-spread {
    width: 100%;
  }
  .page-slot.is-spread img {
    max-width: min(95vw, 1400px);
  }

  /* Desktop: show 2 portrait pages side by side */
  @media (min-width: 700px) {
    #stage.dual-mode .page-slot {
      width: 50%;
      padding: 0 4px;
    }
    #stage.dual-mode .page-slot img {
      max-width: 100%;
      max-height: calc(100vh - 120px);
    }
  }

  /* Mobile: full width single page */
  @media (max-width: 699px) {
    .page-slot img {
      max-height: calc(100vh - 110px);
      max-width: 96vw;
    }
  }

  /* ── Transitions ── */
  .anim-in-right { animation: fadeSlideRight 0.28s ease forwards; }
  .anim-in-left  { animation: fadeSlideLeft  0.28s ease forwards; }

  @keyframes fadeSlideRight {
    from { opacity: 0; transform: translateX(40px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes fadeSlideLeft {
    from { opacity: 0; transform: translateX(-40px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ── Click zones (invisible, left/right halves) ── */
  #zone-prev, #zone-next {
    position: absolute;
    top: 0; bottom: 0;
    width: 30%;
    cursor: pointer;
    z-index: 5;
  }
  #zone-prev { left: 0; }
  #zone-next { right: 0; }

  /* Arrow hints on hover */
  #zone-prev::after, #zone-next::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 28px; height: 28px;
    border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: 50%;
    transform: translateY(-50%);
    opacity: 0;
    transition: opacity 0.2s;
    background: rgba(13,13,13,0.6);
    display: flex; align-items: center; justify-content: center;
  }
  #zone-prev:hover::after { opacity: 1; left: 16px; }
  #zone-next:hover::after { opacity: 1; right: 16px; }

  /* ── Bottom nav ── */
  #nav {
    flex-shrink: 0;
    width: 100%;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #0d0d0d;
    border-top: 1px solid rgba(255,255,255,0.06);
    padding: 0 20px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .nav-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(204,204,204,0.7);
    font-size: 13px;
    width: 36px; height: 32px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.18s;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .nav-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border-color: rgba(255,255,255,0.3);
  }
  .nav-btn:disabled { opacity: 0.18; cursor: default; }

  /* Thumbnail strip */
  #thumb-strip {
    flex: 1;
    overflow-x: auto;
    display: flex;
    gap: 6px;
    align-items: center;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  #thumb-strip::-webkit-scrollbar { display: none; }

  .thumb {
    flex-shrink: 0;
    height: 34px;
    width: auto;
    opacity: 0.35;
    cursor: pointer;
    border: 1px solid transparent;
    border-radius: 1px;
    transition: opacity 0.18s, border-color 0.18s;
    object-fit: cover;
  }
  .thumb:hover { opacity: 0.65; }
  .thumb.active {
    opacity: 1;
    border-color: rgba(255,255,255,0.5);
  }

  /* ── Preload indicator ── */
  #loading {
    position: fixed;
    inset: 0;
    background: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.4s;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading-text {
    font-size: 10px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
    animation: pulse 1.2s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.6; }
  }
</style>
</head>
<body>

<div id="loading"><span id="loading-text">Loading</span></div>

<div id="viewer">

  <div id="header">
    <span id="header-title">蔡佩伶｜小提琴學位音樂會</span>
    <span id="counter">1 / 18</span>
  </div>

  <div id="book-wrap">
    <div id="zone-prev" onclick="navigate(-1)" role="button" aria-label="上一頁"></div>
    <div id="zone-next" onclick="navigate(1)"  role="button" aria-label="下一頁"></div>
    <div id="stage"></div>
  </div>

  <nav id="nav">
    <button class="nav-btn" id="btn-prev" onclick="navigate(-1)" aria-label="上一頁">&#9664;</button>
    <div id="thumb-strip"></div>
    <button class="nav-btn" id="btn-next" onclick="navigate(1)" aria-label="下一頁">&#9654;</button>
  </nav>

</div>

<script>
// ── Page data ──────────────────────────────────────────────
const PAGES = [
  {src:'imgs/A5-00.jpg',       type:'single', label:'封面'},
  {src:'imgs/A5-01.jpg',       type:'single', label:'01'},
  {src:'imgs/A5-02.jpg',       type:'single', label:'02'},
  {src:'imgs/A5-03.jpg',       type:'single', label:'03'},
  {src:'imgs/A5-04.jpg',       type:'single', label:'04'},
  {src:'imgs/A5-05.jpg',       type:'single', label:'05'},
  {src:'imgs/A5-06.jpg',       type:'single', label:'06'},
  {src:'imgs/A5-07.jpg',       type:'single', label:'07'},
  {src:'imgs/A5-08.jpg',       type:'single', label:'08'},
  {src:'imgs/A5-09.jpg',       type:'single', label:'09'},
  {src:'imgs/A5-10.jpg',       type:'single', label:'10'},
  {src:'imgs/A5-11.jpg',       type:'single', label:'封底'},
  {src:'imgs/A5曲目表-01.jpg', type:'spread', label:'曲目 1'},
  {src:'imgs/A5曲目表-02.jpg', type:'spread', label:'曲目 2'},
  {src:'imgs/A5曲目表-03.jpg', type:'spread', label:'曲目 3'},
  {src:'imgs/A5曲目表-04.jpg', type:'spread', label:'曲目 4'},
  {src:'imgs/A5曲目表-05.jpg', type:'spread', label:'曲目 5'},
  {src:'imgs/A5曲目表-06.jpg', type:'spread', label:'曲目 6'},
];

// ── State ──────────────────────────────────────────────────
let cur = 0;
let transitioning = false;

const isWide = () => window.innerWidth >= 700;

// ── Build thumbnail strip ──────────────────────────────────
(function buildThumbs() {
  const strip = document.getElementById('thumb-strip');
  PAGES.forEach((p, i) => {
    const img = document.createElement('img');
    img.src = p.src;
    img.className = 'thumb' + (i === 0 ? ' active' : '');
    img.alt = p.label;
    img.onclick = () => goTo(i);
    strip.appendChild(img);
  });
})();

function updateThumbs() {
  const thumbs = document.querySelectorAll('.thumb');
  thumbs.forEach((t, i) => t.classList.toggle('active', i === cur));
  // Scroll active thumb into view
  const active = thumbs[cur];
  if (active) active.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
}

// ── Render ─────────────────────────────────────────────────
function render(dir) {
  const stage = document.getElementById('stage');
  const p = PAGES[cur];
  const wide = isWide();
  const animClass = dir >= 0 ? 'anim-in-right' : 'anim-in-left';

  stage.innerHTML = '';

  if (p.type === 'spread') {
    // Spread: always single image full-width
    stage.classList.remove('dual-mode');
    const slot = makeSlot(p, true, animClass);
    stage.appendChild(slot);
  } else if (wide && cur + 1 < PAGES.length && PAGES[cur + 1].type === 'single' && cur % 2 === 1) {
    // Desktop: show pair (left + right) — only when both are single pages and cur is odd
    stage.classList.add('dual-mode');
    stage.appendChild(makeSlot(p, false, animClass));
    stage.appendChild(makeSlot(PAGES[cur + 1], false, animClass));
  } else if (wide && cur - 1 >= 0 && PAGES[cur - 1].type === 'single' && cur % 2 === 0 && cur > 0 && dir < 0) {
    // Desktop navigating back — show pair (cur-1, cur)
    stage.classList.add('dual-mode');
    stage.appendChild(makeSlot(PAGES[cur - 1], false, animClass));
    stage.appendChild(makeSlot(p, false, animClass));
  } else {
    // Single
    stage.classList.remove('dual-mode');
    const slot = makeSlot(p, false, animClass);
    stage.appendChild(slot);
  }

  // Counter
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + PAGES.length;
  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur >= PAGES.length - 1;

  updateThumbs();
  transitioning = false;
}

function makeSlot(page, isSpread, animClass) {
  const slot = document.createElement('div');
  slot.className = 'page-slot' + (isSpread ? ' is-spread' : '');
  const img = document.createElement('img');
  img.src = page.src;
  img.alt = page.label;
  img.draggable = false;
  img.className = animClass;
  slot.appendChild(img);
  return slot;
}

// ── Navigation ────────────────────────────────────────────
function navigate(dir) {
  if (transitioning) return;
  const next = cur + dir;
  if (next < 0 || next >= PAGES.length) return;
  transitioning = true;
  cur = next;
  render(dir);
}

function goTo(i) {
  if (i === cur) return;
  const dir = i > cur ? 1 : -1;
  cur = i;
  render(dir);
}

// ── Keyboard ──────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') navigate(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'PageUp')   navigate(-1);
  if (e.key === 'Home') goTo(0);
  if (e.key === 'End')  goTo(PAGES.length - 1);
});

// ── Touch swipe ───────────────────────────────────────────
let touchStartX = null, touchStartY = null;
document.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].clientX;
  touchStartY = e.changedTouches[0].clientY;
}, {passive: true});
document.addEventListener('touchend', e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  // Only horizontal swipes (not scrolling)
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
    navigate(dx < 0 ? 1 : -1);
  }
  touchStartX = touchStartY = null;
}, {passive: true});

// ── Preload first few pages, then hide loading screen ─────
(function preload() {
  let loaded = 0;
  const toLoad = Math.min(3, PAGES.length);
  PAGES.slice(0, toLoad).forEach(p => {
    const img = new Image();
    img.onload = img.onerror = () => {
      loaded++;
      if (loaded >= toLoad) {
        render(1);
        setTimeout(() => document.getElementById('loading').classList.add('done'), 120);
      }
    };
    img.src = p.src;
  });
})();
</script>
</body>
</html>
