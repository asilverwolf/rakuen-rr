<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Shop｜RakuenɒuyɘЯ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap');
  :root {
    --black: #04040A;
    --deep: #080810;
    --grey-dark: #1A1A2A;
    --grey: #888899;
    --grey-light: #BBBBCC;
    --white: #F0F0F5;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--black); color:var(--white); font-family:'Space Mono',monospace; font-size:14px; }

  /* NAV */
  nav {
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:24px 40px;
    background:linear-gradient(to bottom,rgba(4,4,10,0.9) 0%,transparent 100%);
  }
  .nav-logo img { height:28px; opacity:0.9; }
  .nav-links { display:flex; gap:32px; }
  .nav-links a { color:var(--grey); text-decoration:none; font-size:13px; letter-spacing:0.12em; text-transform:uppercase; transition:color 0.2s; }
  .nav-links a:hover, .nav-links a.active { color:var(--white); }

  /* PAGE */
  .page-header {
    padding:140px 60px 48px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .page-header h1 {
    font-family:'EB Garamond',serif; font-size:clamp(32px,5vw,56px);
    font-weight:400; letter-spacing:0.04em; color:var(--white);
    margin-bottom:8px;
  }
  .page-header p { color:var(--grey); font-size:13px; letter-spacing:0.10em; }

  /* GRID */
  .shop-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
    gap:2px;
    padding:2px;
    max-width:1400px;
    margin:40px auto 80px;
    padding-inline:40px;
  }

  /* PRODUCT CARD */
  .product-card {
    display:block; text-decoration:none;
    background:var(--deep);
    position:relative; overflow:hidden;
    aspect-ratio:3/4;
    cursor:pointer;
    transition:opacity 0.3s;
  }
  .product-card:hover { opacity:0.85; }
  .product-card:hover .card-cta { opacity:1; transform:translateY(0); }

  .card-img {
    width:100%; height:75%;
    background:#1a1a1a;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .card-img-placeholder {
    font-size:12px; color:rgba(255,255,255,0.15); letter-spacing:0.12em;
    text-align:center;
  }
  .card-img img { width:100%; height:100%; object-fit:cover; }

  .card-collab {
    position:absolute; top:16px; left:16px;
    font-size:11px; letter-spacing:0.14em; color:rgba(255,255,255,0.5);
    background:rgba(0,0,0,0.6); padding:4px 8px;
  }

  .card-info {
    height:25%;
    padding:16px 20px;
    display:flex; flex-direction:column; justify-content:center; gap:6px;
    border-top:1px solid rgba(255,255,255,0.06);
  }
  .card-name { font-size:14px; color:var(--white); letter-spacing:0.04em; }
  .card-sub  { font-size:12px; color:var(--grey); letter-spacing:0.08em; }
  .card-price { font-size:15px; color:var(--white); font-weight:700; margin-top:4px; }

  .card-cta {
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(240,240,245,0.96); color:var(--black);
    text-align:center; padding:12px;
    font-size:13px; letter-spacing:0.12em; font-weight:700;
    opacity:0; transform:translateY(8px); transition:all 0.25s;
  }

  /* FOOTER */
  footer {
    border-top:1px solid rgba(255,255,255,0.06);
    padding:40px 60px;
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:16px;
  }
  footer a { color:var(--grey); text-decoration:none; font-size:13px; letter-spacing:0.08em; }
  footer a:hover { color:var(--white); }
  .footer-copy { color:rgba(255,255,255,0.2); font-size:12px; letter-spacing:0.06em; }

  @media (max-width:640px) {
    .page-header { padding:120px 24px 32px; }
    .shop-grid { padding-inline:16px; margin:24px auto 60px; }
    nav { padding:20px 24px; }
    footer { padding:32px 24px; }
  }
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo"><img src="../logo-rakuen.png" alt="RakuenɒuyɘЯ"></a>
  <div class="nav-links">
    <a href="../index.html">Home</a>
    <a href="../what-we-do.html">Work</a>
    <a href="index.html" class="active">Shop</a>
  </div>
</nav>

<div class="page-header">
  <h1>Shop</h1>
  <p>開放下單 · 截單後 1 週出貨</p>
</div>

<div class="shop-grid">
  <a href="jersey-01.html" class="product-card">
    <div class="card-img">
      <!-- 替換為實際商品圖：src="../assets/shop/jersey-01/hero.jpg" -->
      <div class="card-img-placeholder">PRODUCT IMAGE<br>hero.jpg</div>
      <div class="card-collab">VOAR × RakuenɒuyɘЯ</div>
    </div>
    <div class="card-info">
      <div class="card-name">復古領足球衣</div>
      <div class="card-sub">Retro Collar Football Jersey</div>
      <div class="card-price">NT$1,580</div>
    </div>
    <div class="card-cta">查看商品 →</div>
  </a>
</div>

<footer>
  <div>
    <a href="../index.html"><img src="../logo-rakuen.png" style="height:24px;opacity:0.6;"></a>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;text-align:right;">
    <a href="mailto:studio@rakuen-rr.com">studio@rakuen-rr.com</a>
    <span class="footer-copy">© 2026 RakuenɒuyɘЯ · rakuen-rr.com</span>
  </div>
</footer>

</body>
</html>
