<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<title>訂單完成｜RakuenɒuyɘЯ Shop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&family=Space+Mono:wght@400;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap');
  :root { --black:#04040A; --grey:#888899; --grey-light:#BBBBCC; --white:#F0F0F5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--black); color:var(--white); font-family:'Space Mono',monospace; font-size:14px; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; }
  .check { font-size:36px; margin-bottom:24px; opacity:0.7; }
  h1 { font-family:'EB Garamond',serif; font-weight:400; font-size:clamp(28px,5vw,48px); letter-spacing:0.04em; margin-bottom:12px; text-align:center; }
  .sub { font-size:13px; color:var(--grey); letter-spacing:0.12em; margin-bottom:8px; text-align:center; }
  .note { font-size:12px; color:var(--grey); letter-spacing:0.08em; margin-top:32px; text-align:center; line-height:1.8; }
  .note a { color:var(--grey-light); text-decoration:none; }
  .note a:hover { color:var(--white); }
  .back { margin-top:40px; padding:12px 28px; border:1px solid rgba(255,255,255,0.2); background:transparent; color:var(--grey-light); font-family:'Space Mono',monospace; font-size:13px; letter-spacing:0.12em; cursor:pointer; text-decoration:none; display:inline-block; transition:all 0.2s; }
  .back:hover { border-color:var(--white); color:var(--white); }
  .divider { width:40px; height:1px; background:rgba(255,255,255,0.12); margin:32px auto; }
</style>
</head>
<body>
  <div class="check">✓</div>
  <h1>訂單完成</h1>
  <div class="sub">Order Confirmed</div>
  <div class="divider"></div>
  <div class="note">
    截單後 1 週內出貨<br>
    Ships within 1 week after batch closes.<br><br>
    確認信將由綠界自動寄出。<br>
    如有問題請聯絡 <a href="mailto:studio@rakuen-rr.com">studio@rakuen-rr.com</a>
  </div>
  <a href="index.html" class="back">← Back to Shop</a>
</body>
</html>
