<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#04040A">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARBOURE Q — R.R</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&family=Space+Mono:wght@400;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap');
  :root{--black:#04040A;--grey:#888899;--white:#F0F0F5;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--black);color:var(--white);font-family:'Space Mono',monospace;overflow-x:hidden;cursor:none;font-size:12px;}
  .cursor{position:fixed;top:0;left:0;width:5px;height:5px;background:#F0F0F5;border-radius:50%;pointer-events:none;z-index:9999;will-change:transform;}
  .cursor-ring{position:fixed;top:0;left:0;width:28px;height:28px;border:1px solid rgba(240,240,245,0.4);border-radius:50%;pointer-events:none;z-index:9998;will-change:transform;}
  nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:24px 48px;}
  nav::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(4,4,10,0.7),transparent);pointer-events:none;}
  .nav-logo{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:0.2em;color:var(--white);text-decoration:none;position:relative;z-index:1;}
  .nav-back{font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:rgba(240,240,245,0.4);text-decoration:none;position:relative;z-index:1;transition:color 0.2s;}
  .nav-back:hover{color:var(--white);}
  .hero{min-height:80vh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 48px 72px;position:relative;overflow:hidden;background:#0e0c0a;}
  .hero-img{position:absolute;inset:0;background-image:url('client-arboure/hero.jpg');background-size:contain;background-position:center;background-repeat:no-repeat;opacity:0.12;filter:sepia(20%);}
  .hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(4,4,10,0.3),rgba(4,4,10,0.9) 80%,#04040A 100%);}
  .hero-content{position:relative;z-index:1;max-width:700px;}
  .cat{font-size:9px;letter-spacing:0.5em;text-transform:uppercase;color:rgba(240,240,245,0.3);margin-bottom:24px;display:block;}
  .hero-title{font-family:'EB Garamond',serif;font-size:clamp(36px,5vw,60px);font-weight:400;line-height:1.1;color:var(--white);margin-bottom:18px;}
  .hero-sub{font-size:11px;letter-spacing:0.2em;color:rgba(240,240,245,0.35);}
  .content{max-width:1100px;margin:0 auto;padding:80px 48px 120px;}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;margin-bottom:2px;}
  .block{background:#0d0d0d;overflow:hidden;position:relative;}
  .block img{width:100%;display:block;transition:transform 0.6s cubic-bezier(0.16,1,0.3,1),opacity 0.4s;opacity:0.88;object-fit:contain;}
  .block:hover img{transform:scale(1.02);opacity:1;}
  .lbl{position:absolute;bottom:14px;left:18px;font-size:9px;letter-spacing:0.4em;text-transform:uppercase;color:rgba(240,240,245,0.3);}
  footer{border-top:1px solid rgba(240,240,245,0.06);padding:48px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .ft{display:flex;align-items:center;gap:16px;}
  .ftag{font-family:'Noto Serif TC',serif;font-size:11px;color:rgba(240,240,245,0.2);letter-spacing:0.1em;font-weight:300;}
  .flinks{display:flex;gap:32px;flex-wrap:wrap;}
  .flinks a{font-size:10px;letter-spacing:0.2em;color:rgba(240,240,245,0.2);text-decoration:none;transition:color 0.2s;}
  .flinks a:hover{color:var(--white);}
  @media(max-width:768px){nav{padding:20px 24px;}.hero{padding:0 24px 56px;}.content{padding:56px 24px 80px;}.grid{grid-template-columns:1fr 1fr;}footer{padding:40px 24px;flex-direction:column;gap:20px;}}
</style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<nav>
  <a href="index.html" class="nav-logo">R.R</a>
  <a href="what-we-do.html#commission" class="nav-back">← work</a>
</nav>
<div class="hero">
  <div class="hero-img"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <span class="cat">commission · brand identity · 2026</span>
    <h1 class="hero-title">ARBOURE Q</h1>
    <p class="hero-sub">logo design · brand naming · visual identity</p>
  </div>
</div>
<div class="content">
  <div class="grid">
    <div class="block" style="grid-column:1/3;padding:40px;background:#f5f0e8;"><img src="client-arboure/hero.jpg" alt="ARBOURE Q logo"><span class="lbl" style="color:rgba(0,0,0,0.25);">logo variations</span></div>
    <div class="block" style="padding:40px;background:#2a1f12;"><img src="client-arboure/concept-04.png" alt="concept B"><span class="lbl">concept B</span></div>
  </div>
  <div class="grid">
    <div class="block" style="padding:40px;background:#f5f0e8;"><img src="client-arboure/concept-01.png" alt="concept A"><span class="lbl" style="color:rgba(0,0,0,0.25);">concept A</span></div>
    <div class="block" style="padding:40px;background:#f5f0e8;"><img src="client-arboure/concept-08.png" alt="concept C"><span class="lbl" style="color:rgba(0,0,0,0.25);">concept C</span></div>
    <div class="block" style="background:#0d0d16;display:flex;align-items:center;justify-content:center;min-height:200px;flex-direction:column;gap:12px;padding:40px;">
      <span style="font-family:'EB Garamond',serif;font-size:28px;color:rgba(240,240,245,0.15);letter-spacing:0.1em;">Embraced by Nature,<br>Sheltered in Wood.</span>
    </div>
  </div>
</div>
<footer>
  <div class="ft"><img src="logo-rakuen.png" style="height:30px;opacity:0.7;" alt="R.R"><span class="ftag">虛構的，所以真實</span></div>
  <div class="flinks">
    <a href="https://instagram.com/rakuen.rr" target="_blank">@rakuen.rr</a>
    <a href="https://instagram.com/liu.ruoyue" target="_blank">@liu.ruoyue</a>
    <span>@ari_lin</span>
    <a href="https://instagram.com/zang.yingran" target="_blank">@zang.yingran</a>
  </div>
</footer>
<script>
  const cur=document.getElementById('cursor'),ring=document.getElementById('cursorRing');
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  (function loop(){cur.style.transform=`translate(${mx-2.5}px,${my-2.5}px)`;rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;ring.style.transform=`translate(${rx-14}px,${ry-14}px)`;requestAnimationFrame(loop);})();
</script>
</body>
</html>
