<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGNAL｜R.R RakuenɒuyɘЯ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400&family=Space+Mono:wght@400;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap');
  :root{--black:#04040A;--grey:#888899;--white:#F0F0F5;--accent:#CC2222;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--black);color:var(--white);font-family:'Space Mono',monospace;overflow-x:hidden;cursor:none;}
  .cursor{position:fixed;width:6px;height:6px;background:var(--white);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:difference;}
  .cursor-ring{position:fixed;width:32px;height:32px;border:1px solid rgba(240,240,245,0.4);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:all 0.12s;mix-blend-mode:difference;}
  .grain{position:fixed;inset:-50%;width:200%;height:200%;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");pointer-events:none;z-index:100;opacity:0.3;animation:gd 0.15s steps(1) infinite;}
  @keyframes gd{0%{transform:translate(0,0)}50%{transform:translate(-1%,1%)}100%{transform:translate(0,0)}}

  nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:24px 48px;background:linear-gradient(to bottom,rgba(4,4,10,0.85),transparent);}
  .nav-logo img{height:26px;mix-blend-mode:screen;opacity:0.85;}
  .nav-links{display:flex;gap:32px;}
  .nav-links a{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--grey);text-decoration:none;transition:color 0.2s;}
  .nav-links a:hover{color:var(--white);}

  /* HERO */
  .hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden;}
  /* Glitch background for NO PROOF */
  .hero-bg{position:absolute;inset:0;background:linear-gradient(160deg,#04040A 0%,#0A0408 50%,#080410 100%);z-index:0;}
  .hero-bg::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(200,30,30,0.012) 2px,rgba(200,30,30,0.012) 4px);}
  /* Occasional glitch line */
  .glitch-line{position:absolute;left:0;right:0;height:1px;background:rgba(200,30,30,0.4);animation:glitch-move 8s infinite;}
  @keyframes glitch-move{0%,90%,100%{top:-10%;opacity:0}92%{top:30%;opacity:1}94%{top:32%;opacity:0}96%{top:70%;opacity:0.5}98%{top:71%;opacity:0}}

  .hero-cover{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:120px 48px 80px;}
  .cover-img{width:min(400px,80%);aspect-ratio:1;object-fit:cover;box-shadow:0 0 80px rgba(180,20,20,0.2);}

  .hero-info{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;padding:120px 64px 80px 32px;}
  .track-label{font-size:8px;letter-spacing:0.5em;text-transform:uppercase;color:var(--accent);margin-bottom:24px;display:block;}
  .track-title{font-family:'EB Garamond',serif;font-size:clamp(48px,6vw,88px);font-weight:400;line-height:1;margin-bottom:8px;letter-spacing:-0.01em;}
  .track-artist{font-size:10px;letter-spacing:0.2em;color:var(--grey);margin-bottom:40px;}
  .track-desc{font-family:'Noto Serif TC',serif;font-size:13px;line-height:2.2;color:rgba(240,240,245,0.55);max-width:360px;margin-bottom:48px;font-weight:300;}

  /* Player bar */
  .player{background:rgba(255,255,255,0.04);border:1px solid rgba(240,240,245,0.08);padding:20px 24px;max-width:400px;margin-bottom:32px;}
  .player-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .player-title{font-size:10px;letter-spacing:0.1em;color:var(--white);}
  .player-sub{font-size:9px;color:var(--grey);}
  .player-controls{display:flex;align-items:center;gap:16px;}
  .player-btn{background:none;border:none;color:var(--grey);cursor:none;font-size:14px;transition:color 0.2s;padding:4px;}
  .player-btn:hover,.player-btn.active{color:var(--white);}
  .player-btn.play{width:32px;height:32px;border:1px solid rgba(240,240,245,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;}
  .player-btn.play:hover{border-color:var(--white);}
  .progress-bar{width:100%;height:2px;background:rgba(240,240,245,0.1);position:relative;cursor:none;margin-bottom:8px;}
  .progress-fill{height:100%;background:rgba(240,240,245,0.6);width:0%;transition:width 0.1s;}
  .player-time{display:flex;justify-content:space-between;font-size:8px;color:var(--grey);}
  .player-note{font-size:9px;color:var(--grey);letter-spacing:0.1em;margin-top:8px;opacity:0.6;}

  /* Lyrics */
  .lyrics-section{padding:80px 48px;}
  .section-label{font-size:9px;letter-spacing:0.4em;text-transform:uppercase;color:var(--grey);margin-bottom:24px;display:block;border-bottom:1px solid rgba(240,240,245,0.06);padding-bottom:12px;}
  .lyrics-toggle{display:flex;align-items:center;gap:12px;cursor:none;margin-bottom:0;}
  .lyrics-toggle-btn{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--grey);background:none;border:1px solid rgba(240,240,245,0.15);padding:8px 16px;cursor:none;transition:all 0.2s;}
  .lyrics-toggle-btn:hover{color:var(--white);border-color:rgba(240,240,245,0.4);}
  .lyrics-content{max-height:0;overflow:hidden;transition:max-height 0.6s ease;}
  .lyrics-content.open{max-height:2000px;}
  .lyrics-text{font-family:'Noto Serif TC',serif;font-size:14px;line-height:3;color:rgba(240,240,245,0.7);padding:32px 0;font-weight:300;white-space:pre-line;}

  /* BTS Photos */
  .bts-section{padding:0 48px 80px;}
  .bts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:3px;margin-top:24px;}
  .bts-item{aspect-ratio:4/3;overflow:hidden;position:relative;}
  .bts-item img{width:100%;height:100%;object-fit:cover;filter:grayscale(20%);transition:filter 0.4s,transform 0.5s;}
  .bts-item:hover img{filter:grayscale(0%);transform:scale(1.04);}

  /* Track nav */
  .track-nav{padding:48px;display:flex;justify-content:space-between;border-top:1px solid rgba(240,240,245,0.06);}
  .track-nav a{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--grey);text-decoration:none;transition:color 0.2s;display:flex;align-items:center;gap:8px;}
  .track-nav a:hover{color:var(--white);}

  footer{background:var(--black);padding:32px 48px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(240,240,245,0.06);}
  .footer-logo img{height:24px;mix-blend-mode:screen;opacity:0.6;}
  .footer-copy{font-size:9px;color:rgba(136,136,153,0.4);}

  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(4,4,10,0.6) 100%);pointer-events:none;z-index:99;}

  @media(max-width:768px){
    .hero{grid-template-columns:1fr;}
    .hero-cover{padding:100px 24px 32px;}
    .cover-img{width:min(280px,90%);}
    .hero-info{padding:24px 24px 60px;}
    nav{padding:16px 24px;}
    .lyrics-section,.bts-section{padding:48px 24px;}
    .track-nav{padding:32px 24px;}
  }

  #global-player{position:fixed;bottom:0;left:0;right:0;z-index:2000;background:rgba(4,4,10,0.96);backdrop-filter:blur(16px);border-top:1px solid rgba(240,240,245,0.08);padding:12px 32px;display:flex;align-items:center;gap:20px;transition:transform 0.3s;}
  #global-player.hidden{transform:translateY(100%);}
  .gp-cover{width:40px;height:40px;object-fit:cover;flex-shrink:0;}
  .gp-info{flex:1;min-width:0;}
  .gp-title{font-family:'EB Garamond',serif;font-size:13px;color:#F0F0F5;letter-spacing:0.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gp-artist{font-size:9px;color:#888899;letter-spacing:0.15em;text-transform:uppercase;margin-top:2px;}
  .gp-controls{display:flex;align-items:center;gap:16px;flex-shrink:0;}
  .gp-btn{background:none;border:none;color:#888899;cursor:none;font-size:12px;padding:4px;transition:color 0.2s;}
  .gp-btn:hover{color:#F0F0F5;}
  .gp-btn.play{width:32px;height:32px;border:1px solid rgba(240,240,245,0.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;}
  .gp-progress-wrap{flex:1;max-width:280px;display:flex;flex-direction:column;gap:4px;}
  .gp-progress{width:100%;height:2px;background:rgba(240,240,245,0.1);position:relative;}
  .gp-progress-fill{height:100%;background:rgba(240,240,245,0.5);width:0%;pointer-events:none;}
  .gp-time{display:flex;justify-content:space-between;font-size:8px;color:#888899;}
  .gp-page-link{font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:#888899;text-decoration:none;border-bottom:1px solid rgba(136,136,153,0.3);padding-bottom:1px;transition:color 0.2s;flex-shrink:0;}
  .gp-page-link:hover{color:#F0F0F5;}
  .gp-toggle{font-size:9px;color:#888899;background:none;border:none;cursor:none;padding:4px;}
  .gp-toggle:hover{color:#F0F0F5;}
  body{padding-bottom:72px;}

</style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div class="grain"></div>

<nav>
  <a href="index.html" class="nav-logo"><img src="logo-main.png" alt="R.R"></a>
  <div class="nav-links">
    <a href="what-we-do.html">what we do</a>
    <a href="index.html#who">who we are</a>
  </div>
</nav>

<section class="hero">
  <div class="hero-bg"><div class="glitch-line"></div></div>
  <div class="hero-cover">
    <img src="cover-signal.jpg" class="cover-img" alt="NO PROOF">
  </div>
  <div class="hero-info">
    <span class="track-label">R.R · 2026 · Irene Zang</span>
    <h1 class="track-title">SIGNAL</h1>
    <p class="track-artist">Irene Zang 臧映然</p>
    <p class="track-desc">你以為你看透了我。<br>那只是我讓你看到的那部分。</p>

    <div class="player" id="player">
      <div class="player-top">
        <div>
          <div class="player-title">NO PROOF</div>
          <div class="player-sub">Luna · Ari · Irene</div>
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="player-time">
        <span id="currentTime">0:00</span>
        <span id="duration">—</span>
      </div>
      <div class="player-controls" style="margin-top:12px;">
        <button class="player-btn play" id="playBtn" onclick="togglePlay()">▶</button>
        <span style="font-size:9px;color:var(--grey);letter-spacing:0.1em;">NO PROOF</span>
      </div>
      <audio id="audioEl" src="music-signal.mp3" preload="metadata"></audio>
      <p class="player-note">音檔即將上線 · 串流平台敬請期待</p>
    </div>
  </div>
</section>

<section class="lyrics-section">
  <span class="section-label">歌詞 Lyrics</span>
  <div class="lyrics-toggle">
    <button class="lyrics-toggle-btn" onclick="toggleLyrics()">展開歌詞</button>
  </div>
  <div class="lyrics-content" id="lyricsContent">
    <div class="lyrics-text">歌詞即將釋出。</div>
  </div>
</section>

<section class="bts-section">
  <span class="section-label">拍攝側記 Behind the Scenes</span>
  <div class="bts-grid">
    <div class="bts-item"><img src="signal-bts0.jpg" alt="Signal BTS"></div>
    <div class="bts-item"><img src="signal-bts1.jpg" alt="Signal BTS"></div>
    <div class="bts-item"><img src="signal-bts2.jpg" alt="Signal BTS"></div>
    <div class="bts-item"><img src="signal-bts3.jpg" alt="Signal BTS"></div>
  </div>
</section>

<div class="track-nav">
  <a href="what-we-do.html">← 全部創作</a>
  <a href="music-jiexian.html">界線 →</a>
</div>

<footer>
  <a href="index.html" class="footer-logo"><img src="logo-main.png" alt="R.R"></a>
  <span class="footer-copy">© 2026 R.R｜RakuenɒuyɘЯ</span>
</footer>

<script>
  const cursor=document.getElementById('cursor'),ring=document.getElementById('cursorRing');
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  (function anim(){cursor.style.left=mx+'px';cursor.style.top=my+'px';rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(anim);})();

  const audio=document.getElementById('audioEl');
  const playBtn=document.getElementById('playBtn');
  const fill=document.getElementById('progressFill');
  const currT=document.getElementById('currentTime');
  const durEl=document.getElementById('duration');
  let playing=false;

  function fmt(s){const m=Math.floor(s/60);return m+':'+(Math.floor(s%60)+'').padStart(2,'0');}
  audio.addEventListener('loadedmetadata',()=>{durEl.textContent=fmt(audio.duration);});
  audio.addEventListener('timeupdate',()=>{
    if(audio.duration){fill.style.width=(audio.currentTime/audio.duration*100)+'%';currT.textContent=fmt(audio.currentTime);}
  });
  function togglePlay(){
    if(playing){audio.pause();playBtn.textContent='▶';}
    else{audio.play().catch(()=>{});playBtn.textContent='❚❚';}
    playing=!playing;
  }
  audio.addEventListener('ended',()=>{playing=false;playBtn.textContent='▶';fill.style.width='0%';});

  function toggleLyrics(){
    const c=document.getElementById('lyricsContent');
    const btn=document.querySelector('.lyrics-toggle-btn');
    c.classList.toggle('open');
    btn.textContent=c.classList.contains('open')?'收起歌詞':'展開歌詞';
  }
</script>
<div id="global-player">
  <img class="gp-cover" id="gp-cover" src="cover-noproof.jpg" alt="cover">
  <div class="gp-info">
    <div class="gp-title" id="gp-title">NO PROOF</div>
    <div class="gp-artist" id="gp-artist">Luna Liu · Irene Zang · Ari Lin</div>
  </div>
  <div class="gp-progress-wrap">
    <div class="gp-progress" id="gp-progress" onclick="gpSeek(event)">
      <div class="gp-progress-fill" id="gp-fill"></div>
    </div>
    <div class="gp-time"><span id="gp-cur">0:00</span><span id="gp-dur">—</span></div>
  </div>
  <div class="gp-controls">
    <button class="gp-btn" onclick="gpPrev()">&#9664;&#9664;</button>
    <button class="gp-btn play" id="gp-play" onclick="gpToggle()">&#9654;</button>
    <button class="gp-btn" onclick="gpNext()">&#9654;&#9654;</button>
  </div>
  <a class="gp-page-link" id="gp-link" href="music-noproof.html">Lyrics ↗</a>
  <button class="gp-toggle" onclick="gpHide()">✕</button>
</div>
<audio id="gp-audio" preload="none"></audio>
<script>
const GP_TRACKS=[
  {title:'NO PROOF',artist:'Luna Liu · Irene Zang · Ari Lin',src:'NO PROOF.mp3',cover:'cover-noproof.jpg',page:'music-noproof.html'},
  {title:'SIGNAL',artist:'Irene Zang',src:'SIGNAL.mp3',cover:'cover-signal.jpg',page:'music-signal.html'},
  {title:'界線',artist:'Ari Lin',src:'界線.mp3',cover:'cover-jiexian.jpg',page:'music-jiexian.html'},
  {title:'BETWEEN',artist:'Luna Liu',src:'BETWEEN.mp3',cover:'cover-between.jpg',page:'music-between.html'},
  {title:'Hey Dirty Boy',artist:'Irene Zang',src:'Hey Dirty Boy.mp3',cover:'cover-noproof.jpg',page:'music-signal.html'},
  {title:'自由のままで',artist:'Ari Lin',src:'自由のままで.mp3',cover:'cover-jiexian.jpg',page:'music-jiexian.html'},
  {title:'STILL HERE',artist:'Luna Liu',src:'STILL HERE.mp3',cover:'cover-between.jpg',page:'music-between.html'},
];
let gpIdx=Math.floor(Math.random()*GP_TRACKS.length),gpPlaying=false;
const gpAudio=document.getElementById('gp-audio');
const gpFmt=s=>{const m=Math.floor(s/60);return m+':'+String(Math.floor(s%60)).padStart(2,'0');};
function gpLoad(idx,play){const t=GP_TRACKS[idx];document.getElementById('gp-title').textContent=t.title;document.getElementById('gp-artist').textContent=t.artist;document.getElementById('gp-cover').src=t.cover;document.getElementById('gp-link').href=t.page;document.getElementById('gp-fill').style.width='0%';document.getElementById('gp-cur').textContent='0:00';document.getElementById('gp-dur').textContent='—';gpAudio.src=t.src;if(play){gpAudio.play().catch(()=>{});gpPlaying=true;gpUpdateBtn();}}
function gpToggle(){if(!gpAudio.src||gpAudio.src===window.location.href){gpLoad(gpIdx,true);return;}if(gpPlaying){gpAudio.pause();gpPlaying=false;}else{gpAudio.play().catch(()=>{});gpPlaying=true;}gpUpdateBtn();}
function gpNext(){gpIdx=(gpIdx+1)%GP_TRACKS.length;gpLoad(gpIdx,true);}
function gpPrev(){gpIdx=(gpIdx-1+GP_TRACKS.length)%GP_TRACKS.length;gpLoad(gpIdx,true);}
function gpUpdateBtn(){document.getElementById('gp-play').innerHTML=gpPlaying?'&#9646;&#9646;':'&#9654;';}
function gpHide(){document.getElementById('global-player').classList.add('hidden');}
function gpSeek(e){if(!gpAudio.duration)return;const r=e.currentTarget.getBoundingClientRect();gpAudio.currentTime=((e.clientX-r.left)/r.width)*gpAudio.duration;}
gpAudio.addEventListener('timeupdate',()=>{if(!gpAudio.duration)return;document.getElementById('gp-fill').style.width=(gpAudio.currentTime/gpAudio.duration*100)+'%';document.getElementById('gp-cur').textContent=gpFmt(gpAudio.currentTime);});
gpAudio.addEventListener('loadedmetadata',()=>{document.getElementById('gp-dur').textContent=gpFmt(gpAudio.duration);});
gpAudio.addEventListener('ended',()=>{gpNext();setTimeout(()=>{gpAudio.play().catch(()=>{});gpPlaying=true;gpUpdateBtn();},300);});
gpLoad(gpIdx,false);
</script>
</body>
</html>
